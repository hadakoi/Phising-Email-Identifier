[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-detector"
version = "0.1.0"
description = "Interpretable phishing and malicious email detection with TF-IDF and Logistic Regression."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "streamlit>=1.35",
]

[project.scripts]
phishing-train = "phishing_detector.train:main"

[tool.setuptools.packages.find]
include = ["phishing_detector*"]

